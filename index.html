<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#080b12;color:#eef2ff}body{padding:24px;box-sizing:border-box}a{color:#8ab4ff}.box{max-width:1100px;margin:auto}.muted{opacity:.7}pre{white-space:pre-wrap;overflow:auto;background:#111827;padding:16px;border-radius:12px}</style></head><body><div id="awe-runtime" class="box">AWE runtime booting…</div><script>
(()=>{"use strict";
const DB="https://raw.githubusercontent.com/ARARAT33/AWEArchiveDB/refs/heads/main/awedb.json";
const root=document.getElementById("awe-runtime");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const http=u=>{try{return /^https?:$/.test(new URL(u,location.href).protocol)}catch{return false}};
const repoOf=u=>{try{const x=new URL(u);if(x.hostname!=="github.com")return null;const p=x.pathname.split("/").filter(Boolean);return p.length<2?null:{owner:p[0],name:p[1].replace(/\.git$/,"")}}catch{return null}};
const json=async u=>{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status+" — "+u);return r.json()};
const tree=async url=>{
  const repo=repoOf(url);
  if(!repo)return[];
  const base="https://api.github.com/repos/"+repo.owner+"/"+repo.name;
  const info=await json(base);
  const branch=info.default_branch||"main";
  const t=await json(base+"/git/trees/"+encodeURIComponent(branch)+"?recursive=1");
  if(t.truncated)console.warn("AWE: Git tree response was truncated for",repo.owner+"/"+repo.name);
  return(t.tree||[]).filter(x=>x.type==="blob").map(x=>({
    path:x.path,
    url:"https://raw.githubusercontent.com/"+repo.owner+"/"+repo.name+"/"+branch+"/"+x.path.split("/").map(encodeURIComponent).join("/"),
    repository:repo.owner+"/"+repo.name,
    branch
  }));
};
const collect=async(v,out=[],seen=new Set())=>{
  if(v==null)return out;
  if(typeof v==="string"){
    if(!http(v)||seen.has(v))return out;
    seen.add(v);
    const repo=repoOf(v);
    if(repo){out.push(...await tree(v));return out}
    if(/\.json(?:[?#]|$)/i.test(v)){try{return collect(await json(v),out,seen)}catch{}}
    out.push({path:v.split("/").pop()||v,url:v});
    return out;
  }
  if(Array.isArray(v)){for(const x of v)await collect(x,out,seen);return out}
  if(typeof v==="object"){
    for(const k of["sources","files","entries","resources","items","routes"])if(v[k]!=null)await collect(v[k],out,seen);
    for(const k of["url","raw_url","source","href","link","repository","repo","github"])if(typeof v[k]==="string"&&http(v[k]))await collect(v[k],out,seen);
  }
  return out;
};
const render=files=>{
  root.innerHTML='<div class="box"><h1>AWE</h1><p class="muted">Runtime կառուցված է AWEArchiveDB-ից • 100% static • '+files.length+' resources</p><ul>'+
    files.map(x=>'<li><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.path)+'</a><span class="muted"> — '+esc(x.repository||"source")+'</span></li>').join("")+
    "</ul></div>";
};
const boot=async()=>{
  try{
    const files=await collect(await json(DB));
    if(!files.length){
      root.innerHTML='<div class="box"><h1>AWE</h1><p>Կայքի կառուցվածքը ամբողջությամբ վերցվում է <code>awedb.json</code>-ից։</p><p class="muted">Manifest-ը հիմա դատարկ է։ Ավելացրու files / sources / repositories / raw URLs։</p><p><a href="'+DB+'" target="_blank" rel="noopener">Բացել awedb.json ↗</a></p></div>';
      return;
    }
    render(files);
  }catch(e){
    root.innerHTML='<div class="box"><h1>AWE Runtime Error</h1><pre>'+esc(e.stack||e.message||e)+'</pre><p class="muted">Static runtime • backend server չկա։</p></div>';
  }
};
boot();
})();
</script></body></html>
