<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search — AWE</title><link rel="stylesheet" href="assets/site.css"><script src="assets/site.js"></script></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html">AWE</a><nav class="links"><a href="projects.html">Projects</a><a href="library.html">Library</a><a href="history.html">History</a><a href="tools.html">Tools</a><a href="docs.html">Docs</a></nav><div class="actions"><select class="select" data-language aria-label="Language"></select><button class="btn" data-theme>◐</button></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">AWE / Search</div><h1>Find anything.</h1><p>Search projects, pages, tools, documentation and resources across AWE.</p><div class="toolbar"><input id="q" class="input" autofocus placeholder="Search AWE…"></div></section><section class="section"><div id="results" class="grid"></div></section></main><footer class="footer"><div class="wrap">© <span data-year></span> AWE</div></footer><script>let data=[];const box=document.getElementById('q'),out=document.getElementById('results');fetch('data/search-index.json').then(r=>r.json()).then(x=>{data=x;render('')});function render(q){q=q.trim().toLowerCase();const rows=!q?data:data.filter(x=>(x.title+' '+x.description+' '+x.url).toLowerCase().includes(q));out.innerHTML=rows.map(x=>'<a class="card" href="'+x.url+'"><span class="kicker">'+x.url+'</span><h3>'+x.title+'</h3><p>'+x.description+'</p></a>').join('')||'<div class="empty">No results. Try another search.</div>'}box.oninput=()=>render(box.value);</script></body></html>
