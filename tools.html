<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AWE — Tools</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;color:#111}header{padding:20px 6%;border-bottom:1px solid #eee}main{max-width:900px;margin:auto;padding:70px 6%}.tool{border:1px solid #e5e5e5;border-radius:18px;padding:25px;margin-top:18px}button{padding:10px 16px;border-radius:999px;border:1px solid #111;background:#fff}</style></head><body><header><a href="index.html"><strong>AWE</strong></a></header><main><p>TOOLS</p><h1>Simple utilities.</h1><div class="tool"><h2>Text statistics</h2><textarea id="t" rows="6" style="width:100%"></textarea><p id="o">0 characters · 0 words</p></div><div class="tool"><h2>UUID</h2><button onclick="u.textContent=crypto.randomUUID()">Generate</button><p id="u"></p></div></main><script>t.oninput=()=>o.textContent=`${t.value.length} characters · ${t.value.trim()?t.value.trim().split(/\s+/).length:0} words`</script></body></html>
